context:
  name: apache-airflow-providers-common-compat
  version: "1.23.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/apache_airflow_providers_common_compat-${{ version }}.tar.gz
  sha256: 366182c246a989fcd18d9a85f16343005adc61b70493b31b545bb80ffced60da

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - flit-core ==4.1.0
  run:
    - python >=${{ python_min }}
    - apache-airflow >=2.11.0
    # tightest of upstream's floors (python >=3.14)
    - asgiref >=3.11.1
tests:
  - python:
      imports:
        - airflow.providers.common.compat
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://github.com/apache/airflow/
  summary: Provider package apache-airflow-providers-common-compat for Apache Airflow
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
  documentation: https://airflow.apache.org/docs/apache-airflow-providers-common-compat/stable/index.html
  repository: https://github.com/apache/airflow/

extra:
  recipe-maintainers:
    - xylar
